[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quotasignal"
version = "0.1.0"
description = "Live shared ChatGPT and Codex quota in the macOS menu bar or Windows system tray."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tatendaz" }]
keywords = ["chatgpt", "codex", "quota", "usage", "menu-bar", "system-tray", "notifications"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Tatendaz/QuotaSignal"
Repository = "https://github.com/Tatendaz/QuotaSignal"
Issues = "https://github.com/Tatendaz/QuotaSignal/issues"
Changelog = "https://github.com/Tatendaz/QuotaSignal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
menu = [
  "rumps>=0.4.0; sys_platform == 'darwin'",
  "pystray>=0.19.5; sys_platform == 'win32'",
  "Pillow>=10.4; sys_platform == 'win32'",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.10",
]
build = ["pyinstaller>=6.11"]

[project.scripts]
quotasignal = "quotasignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quotasignal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.report]
# The rumps and pystray event loops need a real desktop session, so the GUI classes stay untested.
fail_under = 65

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
