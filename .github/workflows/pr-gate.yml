name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-gate:
    name: Docs gate (features + summaries)
    # Dependabot bumps carry no feature work, so they skip the docs gate.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require feature and summary docs
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed" | grep -q '^docs/features/.*\.md$' || { echo 'Missing docs/features entry'; exit 1; }
          echo "$changed" | grep -q '^docs/summaries/.*\.md$' || { echo 'Missing docs/summaries entry'; exit 1; }

  new-code-has-tests:
    name: New code has new tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require tests with Python source changes
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          source_changed="$(echo "$changed" | grep '^src/.*\.py$' || true)"
          tests_changed="$(echo "$changed" | grep '^tests/test_.*\.py$' || true)"
          if [ -n "$source_changed" ] && [ -z "$tests_changed" ]; then
            echo "Python source changed without tests"
            exit 1
          fi
