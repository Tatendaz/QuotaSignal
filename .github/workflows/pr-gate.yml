name: PR Gate

on:
  pull_request:
    branches: [main]

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require feature and summary docs
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed" | grep -q '^docs/features/.*\.md$' || { echo 'Missing docs/features entry'; exit 1; }
          echo "$changed" | grep -q '^docs/summaries/.*\.md$' || { echo 'Missing docs/summaries entry'; exit 1; }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  new-code-has-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tests with Python source changes
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          source_changed="$(echo "$changed" | grep '^src/.*\.py$' || true)"
          tests_changed="$(echo "$changed" | grep '^tests/test_.*\.py$' || true)"
          if [ -n "$source_changed" ] && [ -z "$tests_changed" ]; then
            echo "Python source changed without tests"
            exit 1
          fi
