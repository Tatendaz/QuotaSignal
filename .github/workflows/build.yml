name: Build desktop apps

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: codex-usage-macos
          - os: windows-latest
            artifact: codex-usage-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[menu,build]"
      - name: Build executable
        run: pyinstaller --name CodexUsage --onefile --windowed --collect-all codex_usage --hidden-import codex_usage.tray scripts/entrypoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
