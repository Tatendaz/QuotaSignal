name: Build desktop apps

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: quotasignal-macos
          - os: windows-latest
            artifact: quotasignal-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[menu,build]"
      - name: Build executable
        run: pyinstaller --name QuotaSignal --onefile --windowed --collect-all quotasignal --hidden-import quotasignal.tray scripts/entrypoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
